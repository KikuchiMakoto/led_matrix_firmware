; LED Matrix Firmware (Arduino framework, Earle Philhower core)
; Canonical build: pio run  -> .pio/firmware.uf2
; Upload: 1200bps touch (auto UF2) or copy UF2 to RPI-RP2 drive.
;
;   pio run -e waveshare_rp2040_zero
;   # UF2 upload (board already in BOOTSEL mass-storage mode):
;   cp .pio/build/waveshare_rp2040_zero/firmware.uf2 /media/$USER/RPI-RP2/

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
build_flags = -O3 -D__RP2040__=1
monitor_speed = 921600
# Upload via picotool over USB (no RPI-RP2 mount needed).
# One-time Linux setup: install 99-platformio-udev.rules, then re-plug.
upload_protocol = picotool
