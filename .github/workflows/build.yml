name: Build Firmware

permissions:
  contents: write

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        pip install platformio

    - name: Build firmware (Arduino, waveshare_rp2040_zero)
      run: |
        pio run -e waveshare_rp2040_zero
        ls -lh .pio/build/waveshare_rp2040_zero/firmware.uf2

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: led_matrix_firmware_arduino
        path: .pio/build/waveshare_rp2040_zero/firmware.uf2

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/led_matrix_firmware_arduino/firmware.uf2
        body: |
          ## LED Matrix Firmware for RP2040 (Arduino)

          Arduino (Earle Philhower core) + PIO BAM firmware:

          - **firmware.uf2**: COBS binary protocol (MODE 1..6bit), PIO shift-out
          - 1200bps touch -> UF2 upload mode (no BOOTSEL press needed)

          ### Usage
          1. Copy `firmware.uf2` to the RPI-RP2 drive
          2. Board reboots and enumerates as USB CDC (`/dev/ttyACM0`)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
